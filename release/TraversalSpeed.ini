; A Bit Better Traversal Movement - settings
; Save this file while the game is running and the change applies within a second (no restart needed).
; 1 always means "the game's normal behaviour" for speeds and multipliers.

[global]
; 0 turns the whole mod off
enabled=1

[speed]
; how fast traversal animations play (faster also gives you control back sooner)
; going up: vaulting onto ledges and climbing up (above ~1.2 the hands stop matching the ledge)
up=1.16
; going down: jumping down from ledges and falling
down=1.42
; stopping at a cliff edge
cliff_stop=1.42
; landing animations after a drop
land=1
; climbing walls with handholds: getting on and off, moving and jumping between holds
climb_wall=1.25
; ladders: getting on, climbing up and down, getting off
ladder=1.25
; ropes, poles, zip lines (getting on and off) and the grappling hook; rope swings and the zip line ride stay normal
rope=1.2
; squeezing through narrow gaps and crawl spaces
squeeze=1.3
; starting to run or sprint (including the turn when you start in another direction)
run_start=1.2
; stopping from a run or sprint, and slowing from a sprint to a walk
run_stop=1.25
; turning around while running, and turning on the spot
turn=1.25
; animations that always play at normal speed (name prefixes, comma-separated): the small automatic hop up or down a
; step while walking looks frozen for a moment when sped up
normal_speed=N_Jump03,N_Jump04
; your own speeds for any animation family: name prefix : speed, comma-separated, e.g. N_Narrow01:1.5,N_LadderU:1.4
; (overrides the groups above; normal_speed still wins)
custom=

[steer]
; steer drops and landing rolls toward where you push the stick (or WASD), like normal walking
enabled=1
; steer while in the air after dropping off a ledge
air=1
; steer the landing for landing_window seconds after touching down
landing=1
landing_window=1.2
; how fast the character turns toward the stick, in degrees per second
turn_rate=189
; keyboard keys for forward, left, back, right (letters or numbers)
keys=WASD

[roll]
; dodge roll outside combat: travel this many times further (1 = normal)
distance=1.37
; how long the roll is stretched, in seconds
time=0.9
; 1 = rolling at an edge carries you over it instead of stopping (only when the drop is safe, see max_drop)
off_ledges=1
; a roll only goes off an edge when there's walkable ground within this many cm below; bigger drops (big cliffs,
; out-of-bounds edges) stop the roll at the edge like the normal game
max_drop=450

[momentum]
; keep moving after landing from a drop instead of stopping on the spot: share of the air speed kept (0 = off)
landing=0.53
; how long that carry lasts, in seconds (it fades out)
landing_time=0.35
; 1 = land where your fall actually takes you instead of being snapped onto the game's planned landing spot
;     (the game's placement is kept when you'd land on a different level, e.g. a platform you're meant to reach)
free_fall=1

[traversal]
; 0 = a dodge roll can't turn into a climb or jump-down while it's still going (no vaulting up walls mid-roll);
;     standing next to a ledge, the button still climbs as usual.  1 = the game's normal behaviour
roll_vault=0
; how long (seconds) from the start of a roll traversals stay blocked
roll_block=0.45
; ...except right at the start: a roll can still turn into a climb or jump-down during its first this-many seconds
;    (pressing the button close to a ledge), but not when it reaches a wall later (0 = blocked from the start)
roll_vault_start=0.15
; short pause (seconds) before another traversal can start, so back-to-back ledges don't cut each other's animations
cooldown=0.13
; only a traversal that changes height by at least this many cm starts that pause (small step-downs chain freely)
cooldown_min_height=150
; how far ahead the game looks for a ledge to show the Acrobacias prompt and let the button start a traversal:
; 1 = normal, smaller = you have to be closer to the edge
prompt_reach=0.25
; 1 = stop the running animation when you push into a wall, instead of running in place
;     (only walls taller than about half the character; low obstacles, props and other characters don't stop you)
wall_stop=1
; hands on the wall while stopped against a tall wall (the character turns to face it squarely)
wall_hand=1
; which animation to use for that pose (one the game has loaded), e.g. N_Door21_Open_Loop (two-hand push, 2.0 s),
; N_Door01_0_Loop (13.3 s), N_Door10_L0 / N_Door10_R0 / N_Door11_L0 / N_Door11_R0 (4.3 s)
wall_hand_anim=N_Door21_Open_Loop
; the wall must reach at least this many cm above the feet for the hands pose (Cloud is about 190 cm tall)
wall_hand_min_height=120
; seconds into that animation to hold (stay within its length above)
wall_hand_time=0.8
; 0 = hold that pose; above 0 = play the animation at this speed instead
wall_hand_rate=0
; prompt_reach used while the hands-on-wall pose shows, so a climbable wall offers its prompt from there
; (1 = the game's normal distance)
wall_hand_prompt_reach=1
; also look for a ledge this many degrees to either side of where the character faces, when there's none straight
; ahead (0 = only straight ahead, like the normal game)
side_angle=35

[camera]
; 1 = the camera follows the character down while falling (e.g. after rolling off a ledge) instead of catching up
;     only after landing. Read once at game start: restart the game after changing these two.
fall_follow=1
; how quickly the camera follows height changes (the game's own value is 5)
fall_follow_speed=40

[transitions]
; how long the game blends from one animation into the next, as a share of its own blend time (1 = normal,
; smaller = snappier). blend: in and out of actions (vaults, drops, landings, climbs, rolls) and running
blend=1
; blends between the running animations themselves (start, stop, turn, walk to run)
locomotion_blend=1
; a blend is never made shorter than this many seconds (unless the game's own blend is already shorter)
blend_min=0.1
